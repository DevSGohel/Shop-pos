name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Legacy Gradle Config
        run: |
          # Bypass the unsupported Gradle check by updating the legacy flutter apply rule
          sed -i 's|apply from: "\$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"|apply from: "\$flutterRoot/packages/flutter_tools/gradle/app_plugin_loader.gradle"\napply from: "\$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"|g' android/app/build.gradle 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
